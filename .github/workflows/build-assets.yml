name: Build assets for distribution

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@e8d43d139fbfbe401c32ef3a3a32e14075f20122 # v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'chore: build assets for distribution'
          file_pattern: 'resources/dist/**'
